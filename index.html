        renderBtnPane.addEventListener('click', renderPreview);
        mobileFab.addEventListener('click', renderPreview);

        // Sync
        syncButton.addEventListener('click', syncFromPreview);
        syncBtnPane.addEventListener('click', syncFromPreview);
        syncBtnPreviewHeader.addEventListener('click', syncFromPreview);

        // Download
        downloadButton.addEventListener('click', () => { downloadHtml(); closeOverflow(); });
        downloadBtnPane.addEventListener('click', downloadHtml);

        // Upload
        uploadHtmlButton.addEventListener('click', () => { htmlFileInput.click(); closeOverflow(); });
        uploadBtnInline.addEventListener('click', () => htmlFileInput.click());
        htmlFileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        // Reset
        resetSampleBtn.addEventListener('click', () => {
            htmlCode.value = SAMPLE_HTML;
            renderPreview();
            closeOverflow();
            showToast('Reset to sample', 'info');
        });

        // Theme
        themeToggleBtn.addEventListener('click', () => { toggleTheme(); closeOverflow(); });

        // Overflow menu
        overflowMenuBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleOverflow(); });
        document.addEventListener('click', (e) => {
            if (!overflowMenu.contains(e.target) && e.target !== overflowMenuBtn) closeOverflow();
        });

        // Toolbar commands
        commandBar.addEventListener('click', (e) => {
            const btn = e.target.closest('.toolbar-btn[data-command]');
            if (btn) executeCommand(btn.dataset.command);
        });

        // Save iframe selection before ANY toolbar control steals focus
        [fontColorPicker, fontBgColorPicker, divBgColorPicker].forEach(picker => {
            picker.addEventListener('mousedown', () => saveIframeSelection());
            picker.addEventListener('focus', () => saveIframeSelection());
        });
        [fontSizeSelect, fontSelect, blockFormatSelect].forEach(sel => {
            sel.addEventListener('mousedown', () => saveIframeSelection());
            sel.addEventListener('focus', () => saveIframeSelection());
        });

        // Also save selection when any toolbar button is about to be clicked
        commandBar.addEventListener('mousedown', (e) => {
            if (e.target.closest('.toolbar-btn')) saveIframeSelection();
        });

        fontColorPicker.addEventListener('change', (e) => executeCommand('foreColor', e.target.value));
        fontBgColorPicker.addEventListener('change', (e) => executeCommand('backColor', e.target.value));
        fontSizeSelect.addEventListener('change', (e) => executeCommand('fontSize', e.target.value));
        fontSelect.addEventListener('change', (e) => executeCommand('fontName', e.target.value));
        clearFormatBtn.addEventListener('click', () => { executeCommand('removeFormat'); showToast('Formatting cleared', 'info', 1500); });

        // Block format (headings, paragraph, blockquote, pre)
        blockFormatSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            if (!val) {
                executeCommand('formatBlock', 'div');
            } else {
                executeCommand('formatBlock', val);
            }
        });

        // Block background color
        divBgColorPicker.addEventListener('change', (e) => {
            if (activeEditor === 'preview' && iframeDoc) {
                restoreIframeSelection();
                const sel = previewFrame.contentWindow.getSelection();
                if (sel && sel.rangeCount > 0) {
                    let node = sel.anchorNode;
                    while (node && node.nodeType !== 1) node = node.parentNode;
                    if (node && node !== iframeDoc.body) {
                        node.style.backgroundColor = e.target.value;
                        saveIframeSelection();
                        syncFromPreviewDebounced();
                        setUnsyncedState();
                    }
                }
            }
        });

        // Focus tracking
        htmlCode.addEventListener('focus', () => { activeEditor = 'code'; updateModeIndicator(); });
        htmlCode.addEventListener('input', () => setUnsyncedState());

        // Insert link
        insertLinkBtn.addEventListener('click', () => openModal(linkModal));
        confirmLinkBtn.addEventListener('click', () => {
            const url = linkURLInput.value.trim();
            if (!url) { linkURLHint.textContent = 'URL is required'; linkURLHint.classList.add('error'); linkURLInput.classList.add('invalid'); return; }
            if (!isValidUrl(url)) { linkURLHint.textContent = 'Please enter a valid URL'; linkURLHint.classList.add('error'); linkURLInput.classList.add('invalid'); return; }

            if (currentRange) {
                const sel = previewFrame.contentWindow.getSelection();
                sel.removeAllRanges();
                sel.addRange(currentRange);
            }
            executeCommand('createLink', url);
            showToast('Link inserted', 'success', 1500);
            closeModal(linkModal);
        });

        // Insert image
        insertImageBtn.addEventListener('click', () => openModal(imageModal));
        confirmImageBtn.addEventListener('click', () => {
            const url = imageURLInput.value.trim();
            if (!url) { imageURLHint.textContent = 'URL is required'; imageURLHint.classList.add('error'); imageURLInput.classList.add('invalid'); return; }
            if (!isValidUrl(url)) { imageURLHint.textContent = 'Please enter a valid URL'; imageURLHint.classList.add('error'); imageURLInput.classList.add('invalid'); return; }

            if (currentRange) {
                const sel = previewFrame.contentWindow.getSelection();
                sel.removeAllRanges();
                sel.addRange(currentRange);
            }

            if (activeEditor === 'preview' && iframeDoc) {
                const alt = imageAltInput.value.trim() || 'Image';
                const imgTag = `<img src="${url}" alt="${alt}" style="max-width:100%;height:auto;display:block;margin:0.75rem 0;border-radius:8px;">`;
                iframeDoc.execCommand('insertHTML', false, imgTag);
                syncFromPreviewDebounced();
            } else {
                const alt = imageAltInput.value.trim() || 'Image';
                const tag = `<img src="${url}" alt="${alt}" style="max-width:100%;height:auto;">`;
                const pos = htmlCode.selectionStart;
                htmlCode.value = htmlCode.value.substring(0, pos) + tag + htmlCode.value.substring(pos);
            }

            showToast('Image inserted', 'success', 1500);
            closeModal(imageModal);
        });

        // Mobile tabs
        mobileTabs.addEventListener('click', (e) => {
            const tab = e.target.closest('.mobile-tab');
            if (!tab) return;
            mobileTabs.querySelectorAll('.mobile-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            localStorage.setItem('editor-mobile-tab', tab.dataset.view);
            handleLayout();
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                renderPreview();
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                openModal(linkModal);
            }
        });

        // Resize handler
        window.addEventListener('resize', debounce(handleLayout, 200));

        // Error banner dismiss
        errorBannerDismiss.addEventListener('click', hideError);

        /* ==========================================================
           INIT
           ========================================================== */
        initTheme();
        populateFonts();
        renderPreview();
        handleLayout();
        updateModeIndicator();

        // Restore mobile tab
        const savedTab = localStorage.getItem('editor-mobile-tab');
        if (savedTab) {
            const tabEl = mobileTabs.querySelector(`[data-view="${savedTab}"]`);
            if (tabEl) {
                mobileTabs.querySelectorAll('.mobile-tab').forEach(t => t.classList.remove('active'));
                tabEl.classList.add('active');
            }
        }
    });
    </script>
</body>
</html>
